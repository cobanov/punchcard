<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>punchcard</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --fg: #1b1a17; --muted: #6b675f;
    --rule: #e4e0d8; --accent: #b4471f; --accent-fg: #fff; --code-bg: #f2efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14130f; --panel: #1c1a15; --fg: #eceae4; --muted: #9b968c;
      --rule: #2c2a24; --accent: #e2825a; --accent-fg: #14130f; --code-bg: #1e1c17;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1.25rem 5rem;
    background: var(--bg); color: var(--fg);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 46rem; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 2rem; }
  h1 { font: 600 1.1rem/1 ui-serif, Georgia, serif; margin: 0; letter-spacing: -.01em; }
  header .who { margin-left: auto; color: var(--muted); font-size: .85rem; }
  a { color: var(--accent); }

  /* The one control that matters: pick a project, say what you are doing, go. */
  .bar {
    display: flex; gap: .5rem; align-items: stretch;
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: 10px; padding: .5rem; margin-bottom: 1.5rem;
  }
  .bar input[type=text] {
    flex: 1 1 auto; min-width: 0; border: 0; background: transparent;
    color: var(--fg); font: inherit; padding: .5rem .6rem; outline: none;
  }
  .bar select {
    border: 0; background: var(--code-bg); color: var(--fg);
    font: inherit; padding: .5rem .6rem; border-radius: 6px; max-width: 12rem;
  }
  .bar button {
    border: 0; border-radius: 6px; padding: .5rem 1.1rem;
    font: 600 inherit; cursor: pointer;
    background: var(--accent); color: var(--accent-fg);
  }
  .bar button.stop { background: var(--fg); color: var(--bg); }
  .bar .elapsed {
    font: 600 1.05rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    align-self: center; padding: 0 .6rem; font-variant-numeric: tabular-nums;
  }
  .bar .running-note { flex: 1 1 auto; align-self: center; padding: 0 .4rem; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  h2 {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); font-weight: 600; margin: 2rem 0 .6rem;
  }
  h2 .total { float: right; text-transform: none; letter-spacing: 0; }

  ul { list-style: none; margin: 0; padding: 0; }
  li.row {
    display: flex; gap: .9rem; align-items: baseline;
    padding: .6rem .2rem; border-bottom: 1px solid var(--rule);
  }
  li.row .span { color: var(--muted); font-variant-numeric: tabular-nums;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; flex: 0 0 6.5rem; }
  li.row .project { flex: 0 0 8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.row .note { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.row .dur { flex: 0 0 auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  li.commits { padding: 0 .2rem .55rem 7.6rem; border-bottom: 1px solid var(--rule); }
  li.commits a { color: var(--muted); font-size: .82rem; text-decoration: none; }
  li.commits a:hover { color: var(--accent); text-decoration: underline; }
  .sha { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .empty, .note-line { color: var(--muted); padding: .8rem .2rem; }

  /* Projects */
  li.project-row { display: flex; gap: .9rem; align-items: baseline;
    padding: .6rem .2rem; border-bottom: 1px solid var(--rule); }
  li.project-row .name { flex: 0 0 10rem; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.project-row .client { flex: 1 1 auto; color: var(--muted); min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.project-row .rate { flex: 0 0 auto; color: var(--muted);
    font-variant-numeric: tabular-nums; font-size: .88rem; }
  li.project-row .actions { flex: 0 0 auto; display: flex; gap: .6rem; }
  li.repos { padding: 0 .2rem .55rem 11rem; border-bottom: 1px solid var(--rule);
    color: var(--muted); font-size: .82rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  li.repos .chip { background: var(--code-bg); padding: .1rem .45rem; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* Unmatched commits — the recovery path for a timer nobody started. */
  li.cluster { padding: .7rem .2rem; border-bottom: 1px solid var(--rule); }
  li.cluster .head { display: flex; gap: .9rem; align-items: baseline; margin-bottom: .45rem; }
  li.cluster .span { color: var(--muted); font-variant-numeric: tabular-nums;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; flex: 0 0 6.5rem; }
  li.cluster .what { flex: 1 1 auto; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  li.cluster .count { flex: 0 0 auto; color: var(--muted); font-size: .88rem; }
  li.cluster form { display: flex; gap: .5rem; align-items: center; padding-left: 7.4rem; flex-wrap: wrap; }
  li.cluster input, li.cluster select {
    border: 1px solid var(--rule); background: var(--panel); color: var(--fg);
    font: inherit; padding: .35rem .55rem; border-radius: 6px; min-width: 0;
  }
  li.cluster input { flex: 1 1 16rem; }
  li.cluster button {
    border: 0; border-radius: 6px; padding: .38rem .9rem; font: 600 inherit;
    cursor: pointer; background: var(--accent); color: var(--accent-fg);
  }

  form.inline { display: flex; gap: .5rem; padding: .8rem .2rem; flex-wrap: wrap; align-items: center; }
  form.inline input, form.inline select {
    border: 1px solid var(--rule); background: var(--panel); color: var(--fg);
    font: inherit; padding: .45rem .6rem; border-radius: 6px; min-width: 0;
  }
  form.inline input.name { flex: 1 1 10rem; }
  form.inline input.client { flex: 1 1 8rem; }
  form.inline input.rate { flex: 0 0 8rem; }
  form.inline input.repo { flex: 1 1 14rem; }
  form.inline button {
    border: 0; border-radius: 6px; padding: .5rem 1rem; font: 600 inherit;
    cursor: pointer; background: var(--accent); color: var(--accent-fg);
  }
  .field-note { color: var(--muted); font-size: .8rem; width: 100%; margin: -.3rem 0 0; }
  .err {
    background: var(--code-bg); border-left: 3px solid var(--accent);
    padding: .7rem .9rem; border-radius: 0 6px 6px 0; margin: 1rem 0;
  }
  .signin { text-align: center; padding: 4rem 0; }
  .signin a {
    display: inline-block; background: var(--accent); color: var(--accent-fg);
    text-decoration: none; font-weight: 600; padding: .7rem 1.4rem; border-radius: 8px;
  }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 1rem; }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer;
    font: inherit; padding: 0; text-decoration: underline; }
</style>
</head>
<body>
<main>
  <header>
    <h1>punchcard</h1>
    <span class="who" id="who"></span>
  </header>
  <div id="root"><p class="empty">Loading…</p></div>
</main>

<script>
// punchcard's web client.
//
// One file, no build step, no dependencies. It is deliberately the smallest
// thing that is genuinely usable, because it is meant to be replaced: whatever
// comes next should be able to throw this away without unpicking anything.
//
// It authenticates with the session cookie, like a browser client should, which
// means every mutation carries the CSRF token the server handed us.

const $ = (sel) => document.querySelector(sel);
const state = { projects: [], repos: {}, current: null, today: [], commits: {}, unmatched: [], github: null, error: null };

const csrf = () =>
  document.cookie.split('; ').find((c) => c.startsWith('punchcard_csrf='))?.split('=')[1] ?? '';

async function api(path, options = {}) {
  const method = options.method ?? 'GET';
  const headers = { Accept: 'application/json' };
  if (options.body !== undefined) {
    headers['Content-Type'] = 'application/json';
    headers['X-CSRF-Token'] = csrf();
  }
  const response = await fetch(path, {
    method, headers, credentials: 'same-origin',
    body: options.body === undefined ? undefined : JSON.stringify(options.body),
  });
  if (response.status === 204) return null;
  const text = await response.text();
  const body = text ? JSON.parse(text) : null;
  if (!response.ok) {
    // The API writes its errors for a person to read. Passing that through beats
    // anything this layer could invent.
    const problem = new Error(body?.detail ?? response.statusText);
    problem.status = response.status;
    throw problem;
  }
  return body;
}

// --- formatting -----------------------------------------------------------

const pad = (n) => String(n).padStart(2, '0');

/** Wall clock for the running timer. Hours are never wrapped at 24: a timer
 *  left running over a weekend should look alarming, because it is. */
function clock(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  return `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
}

/** Totals the way a person says them. Nobody bills in seconds. */
function total(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h && m) return `${h}s ${m}d`;
  if (h) return `${h}s`;
  return `${m}d`;
}

const hhmm = (iso) =>
  new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

/** Elapsed time for a running session comes from started_at, not from the
 *  seconds the server last reported — otherwise the clock freezes between
 *  refreshes. */
const elapsed = (session) => (Date.now() - new Date(session.started_at)) / 1000;

const escape = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

const projectName = (id) => state.projects.find((p) => p.id === id)?.name ?? '—';

// --- data -----------------------------------------------------------------

async function load() {
  try {
    const [projects, sessions, github] = await Promise.all([
      api('/v1/projects'),
      api(`/v1/sessions?from=${encodeURIComponent(startOfToday())}&to=${encodeURIComponent(new Date().toISOString())}`),
      api('/v1/github/status'),
    ]);
    state.projects = projects.projects;
    state.today = sessions.sessions;
    state.github = github;
    state.current = state.today.find((s) => s.running) ?? null;
    state.error = null;

    // Unmatched commits over the last week — the same span the server re-scans,
    // and long enough that a timer forgotten on Friday is still recoverable on
    // Monday. A failure here must not stop the rest of the page.
    try {
      const week = new Date(Date.now() - 7 * 864e5).toISOString();
      const to = new Date().toISOString();
      state.unmatched = (await api(
        `/v1/github/unmatched?from=${encodeURIComponent(week)}&to=${encodeURIComponent(to)}`)).clusters ?? [];
    } catch { state.unmatched = []; }

    // Linked repositories, per project. Optional to have, so a failure here
    // must not stop the page rendering.
    await Promise.all(state.projects.map(async (p) => {
      try { state.repos[p.id] = (await api(`/v1/projects/${p.id}/repos`)).repos; }
      catch { state.repos[p.id] = []; }
    }));

    // Commit counts are per session; fetch them for the finished ones only.
    await Promise.all(state.today.filter((s) => !s.running).map(async (s) => {
      try { state.commits[s.id] = (await api(`/v1/sessions/${s.id}/commits`)).commits; }
      catch { /* a missing commit list must not blank the page */ }
    }));
  } catch (err) {
    if (err.status === 401) { render(signedOut()); return; }
    state.error = err.message;
  }
  render();
}

function startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.toISOString();
}

// --- actions --------------------------------------------------------------

async function start() {
  const projectID = $('#project')?.value;
  const note = $('#note')?.value ?? '';
  if (!projectID) return;
  try { await api('/v1/sessions', { method: 'POST', body: { project_id: projectID, note } }); }
  catch (err) { state.error = err.message; }
  await load();
}

async function stop() {
  if (!state.current) return;
  try { await api(`/v1/sessions/${state.current.id}/stop`, { method: 'POST', body: {} }); }
  catch (err) { state.error = err.message; }
  await load();
}

async function createProject(event) {
  event.preventDefault();
  const form = event.target;
  const name = form.name.value.trim();
  if (!name) return;

  // The rate is typed in whole currency units because that is how people say
  // it; the API takes minor units, because money is never a float here.
  const typed = form.rate.value.trim();
  const body = { name, client: form.client.value.trim(), currency: form.currency.value };
  if (typed) body.hourly_rate_cents = Math.round(parseFloat(typed) * 100);

  try {
    await api('/v1/projects', { method: 'POST', body });
    form.reset();
  } catch (err) { state.error = err.message; }
  await load();
}

async function archiveProject(id, name) {
  if (!confirm(`Archive “${name}”? Its recorded time is kept.`)) return;
  try { await api(`/v1/projects/${id}`, { method: 'DELETE' }); }
  catch (err) { state.error = err.message; }
  await load();
}

async function editRate(id, current) {
  const typed = prompt('Hourly rate, in whole units. Empty to remove it.',
    current == null ? '' : (current / 100).toFixed(2));
  if (typed === null) return;
  const body = typed.trim() === ''
    ? { clear_hourly_rate: true }
    : { hourly_rate_cents: Math.round(parseFloat(typed) * 100) };
  try { await api(`/v1/projects/${id}`, { method: 'PATCH', body }); }
  catch (err) { state.error = err.message; }
  await load();
}

async function recover(event, index) {
  event.preventDefault();
  const cluster = state.unmatched[index];
  if (!cluster) return;
  const form = event.target;
  try {
    await api('/v1/github/unmatched/recover', {
      method: 'POST',
      body: {
        project_id: form.project.value,
        from: cluster.from,
        to: cluster.to,
        note: form.note.value.trim(),
      },
    });
  } catch (err) { state.error = err.message; }
  await load();
}

async function linkRepo(event, projectID) {
  event.preventDefault();
  const input = event.target.repo;
  const fullName = input.value.trim();
  if (!fullName) return;
  try {
    await api(`/v1/projects/${projectID}/repos`, { method: 'POST', body: { full_name: fullName } });
    input.value = '';
  } catch (err) { state.error = err.message; }
  await load();
}

async function unlinkRepo(projectID, repoID) {
  try { await api(`/v1/projects/${projectID}/repos/${repoID}`, { method: 'DELETE' }); }
  catch (err) { state.error = err.message; }
  await load();
}

// --- rendering ------------------------------------------------------------

function signedOut() {
  return `
    <div class="signin">
      <a href="/v1/auth/oauth/github?scope=repo">Sign in with GitHub</a>
      <p class="hint">
        The same authorization signs you in and lets punchcard read the commits
        behind your work. Nothing is written to your repositories.
      </p>
    </div>`;
}

function bar() {
  if (state.current) {
    return `
      <div class="bar">
        <span class="elapsed" id="elapsed">${clock(elapsed(state.current))}</span>
        <span class="running-note">
          <strong>${escape(projectName(state.current.project_id))}</strong>
          · ${escape(state.current.note || '—')}
        </span>
        <button class="stop" onclick="stop()">Stop</button>
      </div>`;
  }
  const options = state.projects
    .map((p) => `<option value="${escape(p.id)}">${escape(p.name)}</option>`).join('');
  return `
    <div class="bar">
      <input type="text" id="note" placeholder="What are you working on?"
             onkeydown="if(event.key==='Enter')start()" autofocus>
      <select id="project">${options}</select>
      <button onclick="start()">Start</button>
    </div>`;
}

function todayList() {
  const finished = state.today.filter((s) => !s.running);
  const seconds = finished.reduce((sum, s) => sum + s.seconds, 0);
  const commitCount = finished.reduce((sum, s) => sum + (state.commits[s.id]?.length ?? 0), 0);

  if (!state.today.length) {
    return `<h2>Today</h2><p class="empty">Nothing recorded yet.</p>`;
  }

  // Oldest first: a day reads forwards, even though the API answers newest first.
  const rows = [...state.today].reverse().map((s) => {
    const span = `${hhmm(s.started_at)}–${s.ended_at ? hhmm(s.ended_at) : '…'}`;
    const dur = s.running ? 'running' : total(s.seconds);
    const commits = state.commits[s.id] ?? [];
    const links = commits.map((c) =>
      `<a href="${escape(c.url)}" target="_blank" rel="noreferrer" title="${escape(c.message.split('\n')[0])}">
         <span class="sha">${escape(c.sha.slice(0, 7))}</span></a>`).join(' ');
    return `
      <li class="row">
        <span class="span">${span}</span>
        <span class="project">${escape(projectName(s.project_id))}</span>
        <span class="note">${escape(s.note || '—')}</span>
        <span class="dur">${dur}</span>
      </li>` + (commits.length ? `
      <li class="commits">${commits.length} commit · ${escape(commits[0].repo)} &nbsp; ${links}</li>` : '');
  }).join('');

  return `
    <h2>Today <span class="total">${total(seconds)} · ${commitCount} commits</span></h2>
    <ul>${rows}</ul>`;
}

const money = (cents) => (cents / 100).toFixed(2);

const dayLabel = (iso) => {
  const d = new Date(iso), today = new Date();
  today.setHours(0, 0, 0, 0);
  if (d >= today) return '';
  return d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' ';
};

/** Work that happened while no timer was running.
 *
 *  This is the other half of what punchcard is for. Forgetting to press start
 *  is the one failure a live timer cannot prevent, and guessing at it — idle
 *  detection and the like — is guessing. The commits are already there, already
 *  timestamped, and they say exactly when the work happened. So rather than
 *  infer, show the evidence and offer to write the record. */
function unmatchedSection() {
  if (!state.unmatched.length) return '';

  const options = (selected) => state.projects.map((p) =>
    `<option value="${escape(p.id)}"${p.id === selected ? ' selected' : ''}>${escape(p.name)}</option>`
  ).join('');

  const rows = state.unmatched.map((cluster, index) => {
    const span = `${dayLabel(cluster.from)}${hhmm(cluster.from)}–${hhmm(cluster.to)}`;
    const repos = (cluster.repos ?? []).join(', ');
    const n = (cluster.commits ?? []).length;
    return `
      <li class="cluster">
        <div class="head">
          <span class="span">${escape(span)}</span>
          <span class="what">${escape(repos)}</span>
          <span class="count">${n} commit${n === 1 ? '' : 's'}</span>
        </div>
        <form onsubmit="recover(event, ${index})">
          <select name="project">${options(cluster.suggested_project_id)}</select>
          <input name="note" value="${escape(cluster.suggested_note ?? '')}" placeholder="What was this?">
          <button>Record</button>
        </form>
      </li>`;
  }).join('');

  return `
    <h2>Unmatched commits <span class="total">last 7 days</span></h2>
    <p class="note-line" style="padding:.2rem">
      Work with no timer running. The commits say when it happened.
    </p>
    <ul>${rows}</ul>`;
}

function projectsSection() {
  const rows = state.projects.map((p) => {
    const rate = p.hourly_rate_cents == null || !p.billable
      ? '—'
      : `${money(p.hourly_rate_cents)} ${escape(p.currency)}/h`;
    const repos = (state.repos[p.id] ?? []).map((r) =>
      `<span class="chip">${escape(r.full_name)}
         <button class="link" onclick="unlinkRepo('${escape(p.id)}','${escape(r.id)}')"
                 title="Unlink">×</button></span>`).join(' ');
    return `
      <li class="project-row">
        <span class="name">${escape(p.name)}</span>
        <span class="client">${escape(p.client || '')}</span>
        <span class="rate">${rate}</span>
        <span class="actions">
          <button class="link" onclick="editRate('${escape(p.id)}', ${p.hourly_rate_cents ?? 'null'})">rate</button>
          <button class="link" onclick="archiveProject('${escape(p.id)}', '${escape(p.name)}')">archive</button>
        </span>
      </li>
      <li class="repos">
        ${repos || '<span>no repositories linked</span>'}
        <form class="inline" style="padding:0" onsubmit="linkRepo(event, '${escape(p.id)}')">
          <input class="repo" name="repo" placeholder="owner/repo" style="padding:.2rem .4rem">
          <button style="padding:.2rem .6rem">link</button>
        </form>
      </li>`;
  }).join('');

  return `
    <h2>Projects</h2>
    <ul>${rows}</ul>
    <form class="inline" onsubmit="createProject(event)">
      <input class="name" name="name" placeholder="New project" required>
      <input class="client" name="client" placeholder="Client (optional)">
      <input class="rate" name="rate" placeholder="Rate / hour" inputmode="decimal">
      <select name="currency">
        <option>TRY</option><option>USD</option><option>EUR</option><option>GBP</option>
      </select>
      <button>Add</button>
      <p class="field-note">
        Linking a repository is optional — punchcard finds the ones you pushed to.
        Link one when you want it to guess which project a stretch of commits belongs to.
      </p>
    </form>`;
}

function githubNote() {
  const gh = state.github;
  if (!gh) return '';
  if (!gh.connected) {
    return `<p class="note-line">GitHub is not connected, so commits will not be attached.
      <a href="/v1/auth/oauth/github?scope=repo">Connect</a></p>`;
  }
  if (gh.last_error) return `<div class="err">GitHub: ${escape(gh.last_error)}</div>`;
  return '';
}

function render(html) {
  if (html !== undefined) { $('#root').innerHTML = html; $('#who').textContent = ''; return; }
  $('#who').textContent = state.github?.login ? `@${state.github.login}` : '';
  $('#root').innerHTML =
    (state.error ? `<div class="err">${escape(state.error)}</div>` : '') +
    bar() + todayList() + unmatchedSection() + projectsSection() + githubNote();
}

// The running clock ticks locally; the data refreshes on its own schedule.
setInterval(() => {
  const el = $('#elapsed');
  if (el && state.current) el.textContent = clock(elapsed(state.current));
}, 1000);
setInterval(load, 30000);

// The server's event stream means a timer started from the CLI or the menu bar
// shows up here at once, rather than on the next poll.
try {
  const events = new EventSource('/v1/events/stream');
  events.onmessage = () => load();
} catch { /* the polling above is the fallback */ }

load();
</script>
