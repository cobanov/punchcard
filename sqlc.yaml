version: "2"
sql:
  - engine: "postgresql"
    # Schema is read from the goose migrations (single source of truth). sqlc
    # understands the -- +goose Up/Down markers and uses only the Up statements.
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/repo/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # Standardize on google/uuid (UUIDv7 generated in Go, Section 5).
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # Plain time.Time / *time.Time instead of pgtype.Timestamptz.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
